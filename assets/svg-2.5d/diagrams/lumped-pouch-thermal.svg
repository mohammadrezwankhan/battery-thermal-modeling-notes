<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="lumped-thermal-title lumped-thermal-desc">
<title id="lumped-thermal-title">CELL THERMAL — One lumped temperature state</title>
<desc id="lumped-thermal-desc">An isometric pouch-cell control volume with a single uniform mean-temperature state, internal heat input, and a convective path to ambient. No internal spatial gradient is represented. Decorative dash motion is not runtime telemetry and stops when reduced motion is requested.</desc>
<defs>
  <linearGradient id="lumped-thermal-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--bg-top)"/><stop offset="1" stop-color="var(--bg)"/></linearGradient>
  <pattern id="lumped-thermal-dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--grid)" opacity=".28"/></pattern>
  <marker id="lumped-thermal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00E5FF"/></marker>
  <style>
    :root { color-scheme: dark light; --bg:#07111F; --bg-top:#0D2235; --surface:#102237; --surface-2:#142B42; --ink:#E8F2FB; --muted:#A6BAD0; --grid:#5F7891; --outline:#36516A; --shadow:#020711; --accent:#00E5FF; }
    @media (prefers-color-scheme: light) { :root { --bg:#F5F9FC; --bg-top:#EAF3F9; --surface:#FFFFFF; --surface-2:#F1F7FA; --ink:#102237; --muted:#40566C; --grid:#AFC2D1; --outline:#9AB0C2; --shadow:#426078; --accent:#083344; } }
    text { font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:var(--ink); }
    .eyebrow { font-size:12px; font-weight:750; letter-spacing:2px; fill:var(--accent); }
    .title { font-size:26px; font-weight:650; letter-spacing:-.35px; }
    .micro { font-size:12px; fill:var(--muted); }
    .label { font-size:15px; font-weight:620; }
    .small-label { font-size:13px; font-weight:620; }
    .stage-top { fill:var(--surface-2); stroke:var(--outline); stroke-width:1.4; }
    .stage-front { fill:var(--surface); stroke:var(--outline); stroke-width:1.2; }
    .edge { stroke:var(--outline); stroke-width:1.3; fill:none; }
    .wire { fill:none; stroke:var(--ink); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .thin-wire { fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .flow { stroke-dasharray:10 9; animation:lumped-thermal-flow 1.8s linear infinite; }
    @keyframes lumped-thermal-flow { to { stroke-dashoffset:-38; } }
    .box-shadow { fill:var(--shadow); opacity:.38; }
    .panel { fill:var(--surface); stroke:var(--outline); stroke-width:1.35; }
    .capsule { fill:var(--surface-2); stroke:var(--outline); stroke-width:1.1; }
    .physics { stroke:#00E5FF; } .estimation { stroke:#10B981; } .power { stroke:#F59E0B; } .qa { stroke:#8B5CF6; } .limits { stroke:#F43F5E; }
    .fill-physics { fill:#083344; stroke:#00E5FF; } .fill-estimation { fill:#064E3B; stroke:#10B981; } .fill-power { fill:#451A03; stroke:#F59E0B; } .fill-qa { fill:#2E1065; stroke:#8B5CF6; } .fill-limits { fill:#4C0519; stroke:#F43F5E; }
    .component { stroke-width:1.7; stroke-linejoin:round; }
    .on-color { fill:#F8FBFF !important; }
    .note { fill:var(--surface); stroke:#F43F5E; stroke-width:1.15; }
    .note-text { font-size:13px; font-weight:560; }
    @media (prefers-reduced-motion: reduce) { .flow { animation:none !important; stroke-dashoffset:0; } }
  </style>
</defs>
<rect width="960" height="560" rx="24" fill="url(#lumped-thermal-bg)"/>
<rect width="960" height="560" rx="24" fill="url(#lumped-thermal-dots)" opacity=".42"/>
<text class="eyebrow" x="40" y="39">CELL THERMAL</text>
<text class="title" x="40" y="77">One lumped temperature state</text>
<text class="micro" x="920" y="42" text-anchor="end" letter-spacing="1.5">2.5D / CONCEPTUAL</text>
<g aria-hidden="true">
  <polygon class="box-shadow" points="480,139 882,278 480,417 78,278" transform="translate(0 18)"/>
  <polygon class="stage-front" points="78,278 480,417 480,443 78,304"/>
  <polygon class="stage-front" points="882,278 480,417 480,443 882,304"/>
  <polygon class="stage-top" points="480,139 882,278 480,417 78,278"/>
  <path d="M160 278 480 168 800 278 480 388Z" fill="none" stroke="var(--grid)" stroke-width=".9" opacity=".26"/>
  <path d="M240 278 480 195 720 278 480 361Z" fill="none" stroke="var(--grid)" stroke-width=".9" opacity=".22"/>
</g>

<!-- A single uniform-temperature control volume. Identical face tones are intentional: no spatial field is shown. -->
<polygon points="210,222 470,150 685,225 422,301" fill="#083344" stroke="#00E5FF" stroke-width="2"/>
<polygon points="210,222 422,301 422,385 210,307" fill="#0A2937" stroke="#00E5FF" stroke-width="1.6"/>
<polygon points="422,301 685,225 685,308 422,385" fill="#092733" stroke="#00E5FF" stroke-width="1.6"/>
<path d="M258 236 461 294 634 244 M258 285 422 344 M461 294 461 365" fill="none" stroke="#5FEAFF" stroke-width="1.2" opacity=".55"/>
<text x="451" y="246" class="label on-color" text-anchor="middle">pouch-cell control volume</text>
<text x="451" y="269" class="small-label on-color" text-anchor="middle">one state: Tmean(t)</text>
<!-- heat generation into the lump -->
<rect x="77" y="245" width="112" height="68" rx="12" class="fill-power component"/>
<text class="small-label on-color" x="133" y="273" text-anchor="middle">Q̇gen</text><text class="micro on-color" x="133" y="294" text-anchor="middle">heat input</text>
<path d="M189 279 234 263" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#lumped-thermal-arrow)"/>
<!-- thermal capacitance and ambient boundary -->
<rect x="445" y="397" width="142" height="46" rx="11" class="fill-physics component"/>
<text class="small-label on-color" x="516" y="417" text-anchor="middle">Cth = m·cp</text><text class="micro on-color" x="516" y="434" text-anchor="middle">thermal storage</text>
<path d="M503 385v12" stroke="#00E5FF" stroke-width="2.5" marker-end="url(#lumped-thermal-arrow)"/>
<rect x="719" y="227" width="155" height="84" rx="12" class="fill-estimation component"/>
<text class="small-label on-color" x="796" y="255" text-anchor="middle">ambient Tamb</text><text class="micro on-color" x="796" y="278" text-anchor="middle">boundary reservoir</text><text class="micro on-color" x="796" y="297" text-anchor="middle">hA · heat transfer</text>
<path d="M685 268h33" fill="none" stroke="#10B981" stroke-width="3" marker-end="url(#lumped-thermal-arrow)"/>
<path d="M685 279h33" fill="none" stroke="#10B981" stroke-width="1.4" stroke-dasharray="4 5" class="flow"/>
<rect x="120" y="405" width="286" height="42" rx="11" class="capsule"/><text class="small-label" x="263" y="431" text-anchor="middle">Cth·dTmean/dt = Q̇gen − hA(Tmean−Tamb)</text>
<text class="micro" x="755" y="354" text-anchor="middle">heat rejection</text>
<rect class="note" x="40" y="478" width="880" height="54" rx="12"/>
<circle cx="62" cy="505" r="7" fill="#F43F5E"/>
<text class="note-text" x="80" y="501">SCOPE</text><text class="micro" x="80" y="519">Single lumped thermal balance only. The uniform face color is schematic, not a spatial temperature validation or a pack-gradient result.</text>
</svg>
